<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0a0a0a"
    >

    <meta
        name="description"
        content="MMA DESTINY — viva sua carreira, construa sua vida e deixe seu legado."
    >

    <title>MMA DESTINY</title>

    <!-- =========================================================
         FONTES
    ========================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         CSS
    ========================================================== -->

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/responsive.css">

</head>


<body>

    <!-- =========================================================
         MMA DESTINY
         APLICAÇÃO PRINCIPAL
    ========================================================== -->

    <div id="mma-destiny-app">

        <!-- O Renderer preenche esta área -->
        <main id="app-content"></main>

    </div>


    <!-- =========================================================
         NAVEGAÇÃO PRINCIPAL
         5 ABAS OFICIAIS
    ========================================================== -->

    <nav
        id="main-navigation"
        class="bottom-navigation"
        aria-label="Navegação principal"
    >

        <button
            type="button"
            class="nav-item active"
            data-route="inicio"
            aria-label="Início"
        >
            <span class="nav-icon">⌂</span>
            <span class="nav-label">INÍCIO</span>
        </button>


        <button
            type="button"
            class="nav-item"
            data-route="carreira"
            aria-label="Carreira"
        >
            <span class="nav-icon">♜</span>
            <span class="nav-label">CARREIRA</span>
        </button>


        <button
            type="button"
            class="nav-item"
            data-route="mundo"
            aria-label="Mundo"
        >
            <span class="nav-icon">◎</span>
            <span class="nav-label">MUNDO</span>
        </button>


        <button
            type="button"
            class="nav-item"
            data-route="vida"
            aria-label="Vida"
        >
            <span class="nav-icon">◇</span>
            <span class="nav-label">VIDA</span>
        </button>


        <button
            type="button"
            class="nav-item"
            data-route="dinastia"
            aria-label="Dinastia"
        >
            <span class="nav-icon">♛</span>
            <span class="nav-label">DINASTIA</span>
        </button>

    </nav>


    <!-- =========================================================
         JAVASCRIPT PRINCIPAL
    ========================================================== -->

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
